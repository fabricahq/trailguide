schemaVersion: 2
skillTargets: [claude]
sources:
  fabrica:
    repository: https://github.com/fabricahq/public-library.git
    ref: release/7
    skills:
      include: [recommended]
      exclude:
        - id: skills/create-verification-skill
          reason: Its SKILL.md links to a folder, which Trail Guide can't keep. Include it again once the library links to a file.
    rules:
      include:
        - practices/code-design/*
        - practices/concurrency/*
        - practices/performance/*
        - practices/readmes/*
        - practices/testing/*
        - techs/go/*
        - techs/javascript/*
        - techs/typescript/*
      exclude:
        - id: techs/typescript/comment-role-result-and-constraints
          reason: This repository's comment policy also covers its website's Astro
            components and private helpers, as its ESLint configuration enforces.
          replacedBy: techs/typescript/comment-role-result-and-constraints
          basedOn: "1.0.0"
