name: Trail Guide
on: pull_request
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # Download and verify Trail Guide, then add it to PATH.
      - name: Install Trail Guide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Install the oldest release the library allows, or the latest release when it names none. yq, which GitHub's
          # Ubuntu runners include, reads the field however the YAML spells it.
          version=$(yq -r '.minTrailguideVersion // ""' .trailguide/config.yaml)
          if [[ -z "$version" ]]; then
            version=$(gh release view --repo fabricahq/trailguide --json tagName --jq '.tagName | ltrimstr("v")')
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          archive="trailguide_${version}_linux_amd64.tar.gz"
          dir="$RUNNER_TEMP/trailguide"
          mkdir -p "$dir" && cd "$dir"
          gh release download "v$version" --repo fabricahq/trailguide \
            --pattern SHA256SUMS --pattern "$archive"
          gh attestation verify SHA256SUMS --repo fabricahq/trailguide \
            --signer-workflow fabricahq/trailguide/.github/workflows/release-planner.yml \
            --source-ref refs/heads/main
          checksum=$(sha256sum "$archive")
          grep -qxF "$checksum" SHA256SUMS
          tar -xzf "$archive" trailguide
          installed="Installed Trail Guide $("$dir/trailguide" --version)."
          echo "$installed" && echo "$installed" >> "$GITHUB_STEP_SUMMARY"
          echo "$dir" >> "$GITHUB_PATH"
      - run: trailguide library check
