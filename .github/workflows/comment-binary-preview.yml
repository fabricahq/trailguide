# Promote trusted PR previews without executing PR code or reading artifact contents.
name: CLI preview downloads
on:
  workflow_run:
    workflows: [Package CLI binaries]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Successful Package CLI binaries run ID to advertise'
        required: true
        type: string
      commit:
        description: 'Full PR commit SHA reviewed for isolated testing'
        required: true
        type: string
permissions:
  actions: read
  contents: read
  pull-requests: write
concurrency:
  group: binary-preview-promotions
  cancel-in-progress: false
jobs:
  comment:
    runs-on: ${{ fromJSON(vars.CI_RUNNERS_PUBLIC).linux }}
    steps:
      - name: Link the completed binary preview on its pull request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const manual = context.eventName === 'workflow_dispatch';
            if ((!manual && context.eventName !== 'workflow_run') ||
                context.ref !== `refs/heads/${context.payload.repository.default_branch}`) {
              throw new Error('Preview promotion must use the default-branch workflow.');
            }
            const {owner, repo} = context.repo;
            const canApprove = async username => {
              const {data: access} = await github.rest.repos.getCollaboratorPermissionLevel({owner, repo, username});
              return ['admin', 'write'].includes(access.permission);
            };
            let run;
            if (manual) {
              const {run_id, commit} = context.payload.inputs;
              if (!/^[1-9][0-9]*$/.test(run_id) || !/^[a-f0-9]{40}$/.test(commit)) {
                throw new Error('Provide a build run ID and the full 40-character commit SHA.');
              }
              if (!await canApprove(context.actor)) {
                throw new Error('Preview approval requires repository write access.');
              }
              ({data: run} = await github.rest.actions.getWorkflowRun({owner, repo, run_id}));
              if (run.head_sha !== commit) {
                throw new Error('The selected run does not match the approved commit.');
              }
            } else {
              run = context.payload.workflow_run;
            }
            if (run.path !== '.github/workflows/package-binaries.yml' ||
                run.event !== 'pull_request' || run.status !== 'completed' || run.conclusion !== 'success' ||
                run.repository.id !== context.payload.repository.id) {
              if (manual) throw new Error('Select a successful PR packaging run in this repository.');
              return;
            }
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner, repo, run_id: run.id, per_page: 100,
            });
            // Artifact order matches install-preview.sh arguments.
            const targets = [
              ['trailguide-darwin-arm64', 'macOS Apple Silicon'],
              ['trailguide-darwin-amd64', 'macOS Intel'],
              ['trailguide-linux-arm64', 'Linux ARM'],
              ['trailguide-linux-amd64', 'Linux Intel/AMD'],
            ];
            const downloads = [];
            for (const [name, label] of targets) {
              const matches = artifacts.filter(a => a.name === name);
              if (matches.length !== 1 || matches[0].expired || matches[0].size_in_bytes <= 0 ||
                  !Number.isFinite(Date.parse(matches[0].expires_at))) {
                core.warning(`Missing, duplicate, or unavailable ${name} preview; no comment posted.`);
                return;
              }
              downloads.push({label, artifact: matches[0]});
            }
            // Query GitHub directly: workflow_run.pull_requests can be empty for fork PRs.
            const pulls = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
              owner, repo, commit_sha: run.head_sha, per_page: 100,
            });
            const marker = '<!-- trailguide-binary-preview -->';
            const runURL = `${context.serverUrl}/${owner}/${repo}/actions/runs/${run.id}`;
            const commitURL = `${context.serverUrl}/${owner}/${repo}/commit/${run.head_sha}`;
            const expires = new Date(Math.min(...downloads.map(d => Date.parse(d.artifact.expires_at)))).toLocaleString('en-US', {
              timeZone: 'UTC', dateStyle: 'medium', timeStyle: 'short',
            });
            // Pin the installer to this trusted default-branch workflow, never the PR's source commit.
            const installerCommit = process.env.GITHUB_WORKFLOW_SHA;
            if (!/^[a-f0-9]{40}$/.test(installerCommit ?? '')) {
              throw new Error('Missing trusted installer commit.');
            }
            const hostname = new URL(context.serverUrl).hostname;
            const installCommand = [
              '(set -eu; installer=$(mktemp);',
              `trap 'rm -f "$installer"' EXIT;`,
              `gh api --hostname ${hostname} -H 'Accept: application/vnd.github.raw+json' '/repos/${owner}/${repo}/contents/_tools/install-preview.sh?ref=${installerCommit}' > "$installer";`,
              'test -s "$installer";',
              `sh "$installer" ${hostname} ${owner}/${repo} ${downloads.map(d => d.artifact.id).join(' ')})`,
            ].join(' ');
            for (const candidate of pulls) {
              if (candidate.base.repo.id !== context.payload.repository.id) continue;
              const {data: pr} = await github.rest.pulls.get({owner, repo, pull_number: candidate.number});
              if (pr.state !== 'open' || pr.head.sha !== run.head_sha) continue;
              // Same-repository branches require write access; fork authorship alone does not establish who can push.
              if (!manual && (pr.head.repo?.id !== context.payload.repository.id || !await canApprove(pr.user.login))) {
                core.notice('External previews need manual approval for this commit. Use Run workflow with its run ID and full SHA.');
                continue;
              }
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: pr.number, per_page: 100,
              });
              const previous = comments.find(c =>
                c.user?.login === 'github-actions[bot]' && c.body?.startsWith(marker));
              // An older completion must not replace a newer run or rerun's download link.
              const stamp = previous?.body.match(/<!-- run:(\d+) attempt:(\d+) -->/);
              if (stamp && (Number(stamp[1]) > run.id ||
                  (Number(stamp[1]) === run.id && Number(stamp[2]) > run.run_attempt))) continue;
              const body = [
                marker,
                `<!-- run:${run.id} attempt:${run.run_attempt} -->`,
                '### CLI preview ready',
                '',
                `A test build for [\`${run.head_sha.slice(0, 7)}\`](${commitURL}) is ready. Packaging and installation checks passed.`,
                '',
                downloads.map(d => `[${d.label}](${runURL}/artifacts/${d.artifact.id})`).join(' · '),
                '',
                '**Warning: Runs code from this PR. For isolated testing only; not an official release.**',
                '',
                '**Manual testing is optional.** With [GitHub CLI](https://cli.github.com/) installed and signed in (`gh auth login`), copy this line to install the build for your computer in the current directory. It replaces any existing `./trailguide` after a successful download:',
                '',
                '```sh',
                installCommand,
                '```',
                '',
                'Then run `./trailguide --help`. No extraction or global installation needed.',
                '',
                `GitHub sign-in required. Downloads expire ${expires} UTC.`,
                '',
                `Unreleased preview · [Build and test results](${runURL}) · [License](${context.serverUrl}/${owner}/${repo}/blob/${run.head_sha}/LICENSE.md)`,
              ].join('\n');
              if (previous) {
                await github.rest.issues.updateComment({owner, repo, comment_id: previous.id, body});
              } else {
                await github.rest.issues.createComment({owner, repo, issue_number: pr.number, body});
              }
            }
