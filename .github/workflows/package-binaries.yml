name: Package CLI binaries
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    # x64 Linux and arm64 macOS, so native binaries of each architecture install and run.
    strategy:
      matrix:
        os: [linux_x64, macos]
    runs-on: ${{ fromJSON(vars.CI_RUNNERS_PUBLIC)[matrix.os] }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Install, upgrade, and roll back native binaries
        run: go test -race -count=1 ./internal/distribution
      - name: Build all candidate targets
        if: runner.os == 'Linux'
        run: go run ./cmd/package-binaries --candidate --output native-artifacts
      - name: Extract preview executables
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir native-previews
          for target in darwin-amd64 darwin-arm64 linux-amd64 linux-arm64; do
            archives=(native-artifacts/trailguide_*_"${target//-/_}".tar.gz)
            test "${#archives[@]}" -eq 1
            tar -xOzf "${archives[0]}" trailguide > "native-previews/trailguide-$target"
            test -s "native-previews/trailguide-$target"
          done
      - name: Upload darwin-amd64 preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: runner.os == 'Linux'
        with:
          path: native-previews/trailguide-darwin-amd64
          archive: false
          retention-days: 7
          if-no-files-found: error
      - name: Upload darwin-arm64 preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: runner.os == 'Linux'
        with:
          path: native-previews/trailguide-darwin-arm64
          archive: false
          retention-days: 7
          if-no-files-found: error
      - name: Upload linux-amd64 preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: runner.os == 'Linux'
        with:
          path: native-previews/trailguide-linux-amd64
          archive: false
          retention-days: 7
          if-no-files-found: error
      - name: Upload linux-arm64 preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: runner.os == 'Linux'
        with:
          path: native-previews/trailguide-linux-arm64
          archive: false
          retention-days: 7
          if-no-files-found: error
