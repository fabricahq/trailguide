# Recheck the current vulnerability database even when no code changes.
name: Dependency security
on:
  push:
  pull_request:
  schedule:
    - cron: '23 14 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  govulncheck:
    # Scan native code and tests on both supported operating systems.
    strategy:
      matrix:
        os: [linux, macos]
    runs-on: ${{ fromJSON(vars.CI_RUNNERS)[matrix.os] }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # A finding or scan failure fails CI; never hide errors or use continue-on-error.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 -test ./...
